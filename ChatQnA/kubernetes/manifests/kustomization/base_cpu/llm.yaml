---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-deploy
  template:
    metadata:
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      labels:
        app: llm-deploy
    spec:
      nodeSelector:
        demo: "chatqna"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
               matchLabels:
                 app: llm-deploy
      hostIPC: true
      containers:
      - envFrom:
        - configMapRef:
            name: qna-config
        image: opea/llm-tgi:latest
        imagePullPolicy: IfNotPresent
        name: llm-deploy
        args:
        ports:
        - containerPort: 9000
        resources:
          limits:
            cpu: 4000m
            memory: 1Gi
          requests:
            cpu: 4000m
            memory: 1Gi
      serviceAccountName: default
---
kind: Service
apiVersion: v1
metadata:
  name: llm-svc
  labels:
    app: llm-deploy
spec:
  type: ClusterIP
  selector:
    app: llm-deploy
  ports:
    - name: llm-svc
      port: 9000
      targetPort: 9000
