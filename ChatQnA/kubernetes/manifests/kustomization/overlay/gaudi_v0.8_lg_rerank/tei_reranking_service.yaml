---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-reranking-service-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei-reranking-service-deploy
  template:
    metadata:
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      labels:
        app: tei-reranking-service-deploy
    spec:
      nodeSelector:
        demo: "chatqna"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
               matchLabels:
                 app: tei-reranking-service-deploy
      containers:
      - envFrom:
        - configMapRef:
            name: qna-config
        env:
        - name: OMPI_MCA_btl_vader_single_copy_mechanism
          value: none
        - name: PT_HPU_ENABLE_LAZY_COLLECTIVES
          value: 'true' 
        - name: MAX_WARMUP_SEQUENCE_LENGTH
          value: '512'
        image: grangli/tei_gaudi:0730
        name: tei-reranking-service-deploy
        args:
        - --model-id
        - $(RERANK_MODEL_ID)
        - --auto-truncate
        volumeMounts:
        - mountPath: /data
          name: model-volume
        - mountPath: /dev/shm
          name: shm
        ports:
        - containerPort: 80
        resources:
          limits:
            habana.ai/gaudi: 1
        # resources:
        #   limits:
        #     cpu: 56000m
        #     memory: 26Gi
        #   requests:
        #     cpu: 56000m
        #     memory: 26Gi
      serviceAccountName: default
      volumes:
      - name: model-volume
        hostPath:
          # directory location on host
          path: /mnt/models
          # this field is optional
          type: Directory
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
---
kind: Service
apiVersion: v1
metadata:
  name: tei-reranking-svc
  labels:
    app: tei-reranking-service-deploy
spec:
  type: ClusterIP
  selector:
    app: tei-reranking-service-deploy
  ports:
    - name: tei-reranking-svc
      port: 8808
      targetPort: 80
